<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | BAS LAB</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="container header-inner">

            <a href="index.html" class="brand">
                <span class="brand-mark">B</span>
                <span>BAS LAB</span>
            </a>

            <a href="index.html" class="login-btn">
                กลับหน้าแรก
            </a>

        </div>
    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                B
            </div>

            <div class="section-label">
                ACCOUNT
            </div>

            <h1>เข้าสู่ระบบ</h1>

            <p class="auth-description">
                เข้าสู่บัญชี BAS LAB เพื่อใช้งานโปรไฟล์และระบบต่าง ๆ
            </p>


            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        ชื่อผู้ใช้
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="กรอกชื่อผู้ใช้"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        รหัสผ่าน
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="กรอกรหัสผ่าน"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    เข้าสู่ระบบ
                </button>

            </form>


            <div id="loginMessage" class="login-message"></div>

        </div>

    </main>


    <footer class="footer">
        <div class="container footer-inner">
            <span>BAS LAB</span>
            <span>© 2026</span>
        </div>
    </footer>


    <script src="js/auth.js"></script>

</body>
</html>
